name: CI Pipeline

on:
    push:
        branches: [main, master, macos]
    pull_request:
        branches: [main, master, macos]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Build content bundles
              run: npm run build

            - name: Run automated test suite
              run: npm test
