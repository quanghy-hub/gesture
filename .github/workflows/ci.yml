name: CI Pipeline

on:
    push:
        branches: [main, master, chrome, chrome-win, firefox, firefox-win]
    pull_request:
        branches: [main, master, chrome, chrome-win, firefox, firefox-win]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build content bundles
              run: npm run build

            - name: Run automated test suite
              run: npm test

            - name: Run type checking (JSDoc + @ts-check)
              run: npm run typecheck

            - name: Build mobile zip package
              run: npm run build:zip

            - name: Upload zip artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gesture-mobile-zip
                  path: dist-zip/gesture.zip
                  if-no-files-found: error
